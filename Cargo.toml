[package]
name = "meowsystem-soneca"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
rust-version = "1.93"
publish = false
repository = "https://github.com/vitoriamariadb/meowsystem-soneca"

[[bin]]
name = "meowsystem-soneca"
path = "src/main.rs"

[dependencies]
notify = { version = "8.2", default-features = false }
serde_json = "1"
tokio = { version = "1.53", default-features = false, features = ["rt", "sync"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[dev-dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio", "p2p"] }
tokio = { version = "1.53", default-features = false, features = ["rt", "sync", "net"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "1f6dc991eaa5115a09be2505cc8a323e5b2b0bff"
default-features = false
features = ["a11y", "applet", "wayland"]

[profile.release]
strip = true
